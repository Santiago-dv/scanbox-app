<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B3B66">
  <meta name="description" content="ScanBox: identifica el contenido de cajas y contenedores con un QR, sin abrir el empaque.">
  <title>ScanBox</title>

  <!-- App instalable -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">

  <!-- Modo oscuro: se aplica antes de dibujar para que la pantalla no parpadee -->
  <script>
    try {
      if (localStorage.getItem('scanbox-tema') === 'oscuro') document.documentElement.dataset.tema = 'oscuro';
    } catch { /* sin almacenamiento: modo claro */ }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="app"></div>

  <!-- Íconos: debe ir ANTES de app.js -->
  <script src="js/vendor/lucide.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
